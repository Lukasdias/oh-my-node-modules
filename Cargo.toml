[package]
name = "oh-my-node-modules"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Find and clean up node_modules directories."
license = "MIT"
repository = "https://github.com/Lukasdias/oh-my-node-modules"
readme = "README.md"
keywords = ["node_modules", "cleanup", "cli", "disk-space"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["docs/", ".github/", "tasks/"]

[[bin]]
name = "onm"
path = "src/main.rs"

[lib]
name = "oh_my_node_modules"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
globset = "0.4"
ignore = "0.4"
owo-colors = { version = "4", features = ["supports-colors"] }
rayon = "1"
indicatif = "0.18.6"
inquire = "0.9.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
